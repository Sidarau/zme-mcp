app = "zme-mcp"
primary_region = "sjc"

[build]

[env]
PORT = "8080"
ZME_OAUTH_DB = "/data/oauth.sqlite3"

[[mounts]]
  source = "zme_oauth"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One instance owns the durable OAuth volume. Independent replicas must not
  # use separate token databases.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
