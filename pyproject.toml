[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zme-mcp"
version = "1.2.0"
description = "Zeug Memory Engine as an MCP server — hybrid search, knowledge graph, and durable notes over stdio or streamable HTTP. ChatGPT deep-research compatible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Sidarau / Zeug Lab" }]
dependencies = [
    "fastmcp>=3.4",
    "uvicorn>=0.30",
]

[project.scripts]
zme-mcp = "zme_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zme_mcp"]
